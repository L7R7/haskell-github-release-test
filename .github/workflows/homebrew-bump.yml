name: Bump Homebrew formula

on:
  release:
    types: [released]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHAs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          for asset in \
            haskell-github-release-test-$V-macOS-aarch64.zip \
            haskell-github-release-test-$V-macOS-x86_64.zip  \
            haskell-github-release-test-$V-Linux-x86_64.zip; do
            gh release download "v$V" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          done
          {
            echo "SHA_MAC_ARM=$(shasum -a 256 haskell-github-release-test-$V-macOS-aarch64.zip | cut -d' ' -f1)"
            echo "SHA_MAC_X86=$(shasum -a 256 haskell-github-release-test-$V-macOS-x86_64.zip  | cut -d' ' -f1)"
            echo "SHA_LINUX=$(shasum   -a 256 haskell-github-release-test-$V-Linux-x86_64.zip   | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/L7R7/homebrew-tap" tap
          cd tap
          mkdir -p Formula
          cat > Formula/haskell-github-release-test.rb <<EOF
          class HaskellGithubReleaseTest < Formula
            desc "Test project for prebuilt-binary GitHub releases of Haskell projects"
            homepage "https://github.com/L7R7/haskell-github-release-test"
            version "$V"
            license "BSD-3-Clause"

            on_macos do
              on_arm do
                url "https://github.com/L7R7/haskell-github-release-test/releases/download/v$V/haskell-github-release-test-$V-macOS-aarch64.zip"
                sha256 "$SHA_MAC_ARM"
              end
              on_intel do
                url "https://github.com/L7R7/haskell-github-release-test/releases/download/v$V/haskell-github-release-test-$V-macOS-x86_64.zip"
                sha256 "$SHA_MAC_X86"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/L7R7/haskell-github-release-test/releases/download/v$V/haskell-github-release-test-$V-Linux-x86_64.zip"
                sha256 "$SHA_LINUX"
              end
            end

            def install
              bin.install "haskell-github-release-test"
            end

            test do
              system bin/"haskell-github-release-test"
            end
          end
          EOF
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              add Formula/haskell-github-release-test.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "haskell-github-release-test $V"
          git push
